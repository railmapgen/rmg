# 代码检查工作流：在提交与合并请求时运行 lint、测试和构建。
name: Code Quality Check

on:
  pull_request:

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Check
        run: |
          npm run lint
          npm run test