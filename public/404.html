<!DOCTYPE html>
<!-- GitHub Pages 单页应用回退页：把深层路径重定向为带查询参数和哈希的入口。 -->
<html>
    <head>
        <meta charset="utf-8" />
        <title>Rail Map Generator</title>
        <script type="text/javascript">
            // GitHub Pages 单页应用回退脚本
            // https://github.com/rafrex/spa-github-pages
            // 版权所有 (c) 2016 Rafael Pedicini，依据 MIT 许可证授权
            // ----------------------------------------------------------------------
            // 该脚本读取当前 URL，将路径与查询部分
            // 转换为查询字符串，再将浏览器重定向到
            // 只包含查询字符串与哈希片段的新 URL。
            // 例如 `http://www.foo.tld/one/two?a=b&c=d#qwe` 会转换为
            // http://www.foo.tld/?p=/one/two&q=a=b~and~c=d#qwe
            // 注意：该 404.html 必须至少为 512 字节，
            // 才能在 Internet Explorer 中生效（当前已超过 512 字节）

            // 如果创建的是项目页面且未使用自定义域名，
            // 应将 `segmentCount` 设为 1（企业版用户可能需要设为大于 1）。
            // 这样代码只替换路径中的路由部分，而不修改
            // 应用所在的真实目录。例如：
            // https://username.github.io/repo-name/one/two?a=b&c=d#qwe becomes
            // https://username.github.io/repo-name/?p=/one/two&q=a=b~and~c=d#qwe
            // 否则应保持 `segmentCount` 为 0。
            var segmentCount = 1;

            var l = window.location;
            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + segmentCount)
                        .join('/') +
                    '/?p=/' +
                    l.pathname
                        .slice(1)
                        .split('/')
                        .slice(segmentCount)
                        .join('/')
                        .replace(/&/g, '~and~') +
                    (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
            );
        </script>
    </head>
    <body></body>
</html>
